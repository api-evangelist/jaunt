name: Jaunt *
description: 'Jaunt (Jaunt VR, later Jaunt XR) was a cinematic virtual-reality and immersive-media
  technology company founded in 2013 and based in Santa Clara, California. It built end-to-end tools
  for capturing, stitching, streaming, and viewing 360-degree cinematic VR, including the Jaunt ONE
  professional camera and a cloud rendering pipeline, before pivoting toward volumetric AR/XR in 2018.
  Backed by GV (Google Ventures) among other investors, the company wound down its XR business and sold
  its underlying technology assets to Verizon in late 2019. This profile was surfaced as a GV portfolio
  company; the company is now defunct and its domains (jaunt.us, jauntxr.com) are parked/for-sale or
  reassigned, so there is no live developer or API surface to enrich.'
